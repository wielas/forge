name: verify
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # `make validate` is the cheap structural check (frontmatter, bash -n).
  # `make verify` executes the repo's claims. The suites that need a live
  # Hermes install or model credentials degrade to `skip` rather than failing,
  # so CI runs what it can and the operator runs the rest on the mini.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make validate

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # `sweep` needs only git and its own gh/uvx stubs, so it runs here like
      # the rest. It was omitted when it shipped, so nothing enforced F18/F19 on
      # a pull request: its cases only ever ran by hand, on one machine. The
      # suites still absent need a live Hermes install or model credentials.
      - run: make verify SUITES="cli substrate template metrics sweep roadmap gate"
