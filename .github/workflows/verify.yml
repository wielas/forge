name: verify
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # `make validate` is the cheap structural check (frontmatter, bash -n).
  # `make verify` executes the repo's complete free verification surface. A
  # genuinely absent live dependency is a named skip; the paid Codex probe is
  # opt-in behind --with-codex and therefore never runs here.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make validate

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # Do not maintain a second suite allowlist here. New deterministic groups
      # become required CI evidence by being part of make verify's default.
      - run: make verify
