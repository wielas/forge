# Repo-level deterministic gates (ADR-0003). Same rules for every agent & human.
pre-commit:
  parallel: true
  commands:
    fmt:
      run: uv run ruff format --check {staged_files}
      glob: "*.py"
    lint:
      run: uv run ruff check {staged_files}
      glob: "*.py"

pre-push:
  # What a pre-push command can and cannot see, measured on lefthook 2.1.10
  # (2026-07-28, by pushing a probe command and printing everything):
  #   {1}, {2}   the remote NAME and URL git is pushing to — substituted from
  #              git's hook argv. Available. Used by no-main-push below.
  #   $1, $@     empty. lefthook does not set shell positionals.
  #   stdin      empty. git puts the destination refs there; lefthook does not
  #              forward it. This is why `git push origin HEAD:main` from a
  #              feature branch cannot be caught here — the guard can see the
  #              remote, never the refs.
  # Commands with no file template (both below) run even when the push carries
  # no changed files. An earlier version of this comment claimed the opposite
  # and told you not to look into it; that was the pre-COMMIT skip
  # ("no files for inspection") being misread. Re-measured 2026-07-28.
  #
  # None of this makes these commands a wall. `--no-verify` and `LEFTHOOK=0`
  # skip the hook outright. The gate that holds is off the host: `make protect`
  # (GitHub branch protection). Do not mistake this for it.
  commands:
    # ADVISORY. Catches the common mistake — being on main and pushing.
    no-main-push:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        [ "$branch" = "main" ] || exit 0
        # The remote being pushed to, NOT the one this branch tracks. Those
        # differ as soon as a second remote exists, and the old code asked
        # branch.<b>.remote (falling back to origin) — so it answered a
        # question about a remote it was not pushing to. When the hook is run
        # by hand with no args lefthook leaves the template unsubstituted, so a
        # leading brace means "unknown" and we fall back. (The sentinel cannot
        # be written out literally here: lefthook would substitute it too.)
        remote='{1}'
        case "$remote" in '{'*) remote=$(git config "branch.$branch.remote" 2>/dev/null || true) ;; esac
        [ -n "$remote" ] || remote=origin
        # Bootstrap exception. The FIRST push to a new repo is what creates
        # main on the remote; there is no PR path to take yet, and without
        # this branch `gh repo create --push` and `git push -u origin main`
        # are both blocked — a fresh project cannot be published at all.
        # Measured 2026-07-28 on hello-forge.
        #
        # FAIL CLOSED. `ls-remote` exits non-zero for "no such remote",
        # "network down" and "auth failed" exactly as readily as for "this
        # remote has no main". The old code treated every one of them as
        # "must be a bootstrap" — measured 2026-07-28, an unreachable origin
        # let a direct push to an existing main straight through. Only an
        # ANSWER may unlock the exception; an error must never.
        if heads=$(git ls-remote --heads "$remote" main 2>/dev/null); then
          if [ -n "$heads" ]; then
            echo "BLOCKED: direct push to main. Chunks land via PR." >&2
            exit 1
          fi
          echo "bootstrap: $remote has no main yet — allowing the push that creates it" >&2
        else
          echo "BLOCKED: cannot reach '$remote' to tell whether main exists, so" >&2
          echo "  this push cannot be shown to be a bootstrap. Refusing to guess." >&2
          echo "  Push a branch and open a PR." >&2
          exit 1
        fi
    # ADVISORY. The rule AGENTS.md already states, enforced where it is cheap.
    # Measured on forgeboard-report 2026-07-30 (audit F7): the lane pushed
    # `chunk/1`…`chunk/6` against a documented `chunk/<id>-<slug>`. CHUNK-1 and
    # CHUNK-2 merged in violation; CHUNK-3–6 were bounced by tier 2 on the name
    # alone, closing PRs #4, #6, #8 and #10 unmerged. `t_298e46f4` is the case
    # that names the cost: verdict `bounce` with the first three dimensions
    # scored 3/3/3 — exemplary work, rejected after implementation, prejudge and
    # review had all been paid for, to enforce a regex. Nothing told the lane at
    # push time, so it learned nothing and repeated it four times.
    #
    # `main` exits 0 here. `no-main-push` above owns the main-branch policy
    # INCLUDING its bootstrap exception, and a second opinion from this command
    # would re-block the push that creates main — the rung-1 failure that
    # exception exists to fix. Do not "tidy" that early exit away.
    #
    # The rule itself lives in scripts/branch-name.sh, called from here AND from
    # CI. Inlining the regex would put a third copy of the rule in the repo —
    # AGENTS.md states it, this hook would restate it, ci.yml would restate it
    # again — and the copies would disagree the first time one was edited. That
    # is F30's defect, and ADR-0003 names lefthook and CI as tiers of one gate,
    # not as two gates.
    #
    # This tier is ADVISORY by construction: `--no-verify` and `LEFTHOOK=0` skip
    # it, exactly as they skip no-main-push. Its value is telling the lane at
    # push time instead of at review time, which is the whole of F7. The tier
    # that cannot be skipped is the CI job running the same script.
    chunk-branch-name:
      run: ./scripts/branch-name.sh
    full-check:
      run: make check
