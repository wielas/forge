# =============================================================================
# forge — settings for the DEFAULT Hermes profile (~/.hermes/config.yaml).
#
# Verified against Hermes v0.19.0 on 2026-07-27. Re-check after every
# `hermes update`: config drifts across upgrades (0.18.2 → 0.19.0 silently
# changed approvals.mode and goals.max_turns). `hermes config check`, then
# `hermes config migrate`.
#
# NOTE: per-agent roles are NOT configured here. A Hermes profile is a separate
# HERMES_HOME directory created with `hermes profile create` — see
# hermes/profiles-bootstrap.sh. An earlier draft of this file had a `profiles:`
# block; no such schema exists.
# =============================================================================

kanban:
  dispatch_in_gateway: true    # default; the dispatcher lives in the gateway
  max_in_progress: 2           # cap concurrent lanes on one mini
  auto_promote_children: false # /roadmap builds the graph deliberately; review
                               # decomposed children before they go ready

approvals:
  # smart is the only mode that is both safe and unattended-viable:
  #   manual → a dispatched worker waits for an approval nobody can give, burns
  #            its runtime, and gets reclaimed
  #   off    → nothing is checked; with the local backend and a reachable bot,
  #            any inbound message can run anything as your user
  mode: smart

skills:
  write_approval: true         # L5 consent gate: skill writes stage under
                               # ~/.hermes/pending/skills/ for a human (ADR-0005)

goals:
  max_turns: 20                # per-chunk goal loops; raise deliberately — each
                               # continuation turn is a full model call

auxiliary:
  goal_judge:                  # ~200 output tokens, once per turn. Never let it
    provider: openrouter       # inherit an expensive main model.
    model: ""                  # pick a cheap fast id via `hermes model`

memory:
  enabled: true

terminal:
  timeout: 1800                # The 180s default kills a real chunk run. At 1800,
                               # a synchronous delegation under ~30 min is safe:
                               # the dispatcher only reclaims after
                               # dispatch_stale_timeout_seconds (4h) with no
                               # heartbeat in the last hour. Cap chunk size rather
                               # than building background/poll machinery.

# ---- crons live in the profile that runs them -------------------------------
# Create them with natural language inside the owning profile, not here:
#   forge-digest    cron  "every day at 07:00, run the digest skill"
#   forge-prejudge  cron  "every day at 02:30, review everything staged in
#                          ~/.hermes/pending/skills/ from the last 24h and
#                          recommend approve/reject per item, one line each"
# The auditor must not be the thing improving itself — keep the guardrail cron on
# a different profile from any self-evolution cron (ADR-0005).
